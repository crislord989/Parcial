name: CI/CD Chinook
on:
  push:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - run: pytest --cov=app -v
        env:
          DB_USER: test
          DB_PASSWORD: test
          DB_HOST: localhost
          DB_PORT: "3306"
          DB_NAME: chinook

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci && npm run test

  deploy-backend:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Backend a EC2 Back_P1
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            cat > /tmp/deploy_backend.sh << 'SCRIPT'
            #!/bin/bash
            cd ~/environment/backend
            git pull origin main
            pip3.11 install -r requirements.txt --quiet
            pkill -f uvicorn || true
            sleep 1
            nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > ~/uvicorn.log 2>&1 &
            echo "done" > /tmp/deploy_backend_done.txt
            SCRIPT
            chmod +x /tmp/deploy_backend.sh
            nohup bash /tmp/deploy_backend.sh > /tmp/deploy_backend.log 2>&1 &
            echo "Deploy backend iniciado"

  deploy-frontend:
    needs: test-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Frontend a EC2 Front_P1
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.FRONTEND_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            cat > /tmp/deploy_frontend.sh << 'SCRIPT'
            #!/bin/bash
            cd ~/environment/frontend
            echo "VITE_API_URL=http://BACKEND_HOST_PLACEHOLDER:8000/api" > .env
            rm -rf node_modules
            npm install --quiet
            ./node_modules/.bin/vite build
            pkill -f serve || true
            sleep 1
            nohup ./node_modules/.bin/serve -s dist -l 3000 > ~/serve.log 2>&1 &
            echo "done" > /tmp/deploy_frontend_done.txt
            SCRIPT
            sed -i "s|BACKEND_HOST_PLACEHOLDER|${{ secrets.BACKEND_HOST }}|g" /tmp/deploy_frontend.sh
            chmod +x /tmp/deploy_frontend.sh
            nohup bash /tmp/deploy_frontend.sh > /tmp/deploy_frontend.log 2>&1 &
            echo "Deploy frontend iniciado"
